services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: stockmarket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: stock-market-app

  instance1:
    image: stock-market-app
    environment:
      DB_HOST: postgres
      SERVER_PORT: 8081
    depends_on:
      postgres:
        condition: service_healthy

  instance2:
    image: stock-market-app
    environment:
      DB_HOST: postgres
      SERVER_PORT: 8082
    depends_on:
      postgres:
        condition: service_healthy

  instance3:
    image: stock-market-app
    environment:
      DB_HOST: postgres
      SERVER_PORT: 8083
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - instance1
      - instance2
      - instance3