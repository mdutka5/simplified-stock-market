spring:
  application:
    name: simplified-stock-market
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/stockmarket
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8080}